<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <h1 id="app-title">Simple To-Do List</h1>
      <p class="subtitle">Create tasks, mark complete, filter and keep data across reloads.</p>

      <form id="task-form" class="task-form" autocomplete="off">
        <input
          id="task-input"
          type="text"
          name="task"
          placeholder="Add a new task"
          aria-label="New task title"
        />
        <button type="submit">Add</button>
      </form>

      <div class="todo-actions">
        <div class="filters" role="group" aria-label="Task filters">
          <button type="button" class="filter-button active" data-filter="all">All</button>
          <button type="button" class="filter-button" data-filter="active">Active</button>
          <button type="button" class="filter-button" data-filter="completed">Completed</button>
        </div>
        <button id="clear-completed" class="secondary">Clear Completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <div class="status-bar">
        <span id="remaining-count">0 items left</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
